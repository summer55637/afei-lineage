name: Apply character creation attribute refresh fix

on:
  push:
    branches:
      - fix/creator-attribute-refresh
    paths:
      - .github/workflows/apply-creator-attribute-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/creator-attribute-refresh
          persist-credentials: true

      - name: Apply the minimal renderer compatibility fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")

          old_guard = "  if(!g||!alloc||!remain)return false;"
          new_guard = "  if(!g||!alloc)return false;"
          old_counter = "  remain.textContent=String(create.pts);"
          new_counter = "  if(remain)remain.textContent=String(create.pts);"

          if source.count(old_guard) != 1 or source.count(old_counter) != 1:
              raise SystemExit("Expected creator-renderer anchors were not found exactly once; no file changed.")

          source = source.replace(old_guard, new_guard).replace(old_counter, new_counter)

          start = source.index("function a58BuildCreateSafe()")
          end = source.index("function a58InstallCreateShell()", start)
          renderer = source[start:end]
          if "if(!g||!alloc)return false;" not in renderer:
              raise SystemExit("Guard verification failed.")
          if "if(remain)remain.textContent=String(create.pts);" not in renderer:
              raise SystemExit("Optional counter verification failed.")

          path.write_text(source, encoding="utf-8")
          print("Creator renderer patched and verified.")
          PY

      - name: Commit fix to the isolated branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix character creation attribute refresh"
          git push origin HEAD:fix/creator-attribute-refresh
